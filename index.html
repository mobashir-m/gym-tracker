<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym" />
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">💪</span>
        <span class="brand-name">Gym Tracker</span>
      </div>
      <div id="cycle-chip" class="cycle-chip" title="Current 8-day cycle"></div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" role="tablist" aria-label="Modes">
    <button class="tab" data-tab="train" role="tab">
      <span class="tab-ico">🏋️</span><span class="tab-label">Train</span>
    </button>
    <button class="tab" data-tab="progress" role="tab">
      <span class="tab-ico">📈</span><span class="tab-label">Progress</span>
    </button>
    <button class="tab" data-tab="build" role="tab">
      <span class="tab-ico">🛠️</span><span class="tab-label">Build</span>
    </button>
    <button class="tab" data-tab="settings" role="tab">
      <span class="tab-ico">⚙️</span><span class="tab-label">Settings</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
